<!DOCTYPE html>
<html>
<head>
    <title>String & Math Function</title>
</head>
<body bgcolor="#155f7a">
    <h1 style="color:gold; text-align:center;"><i>String And Math Function</i></h1>
    <script>        var a = "Welcome to";
        var b = " AWH";
        var c = " Collage";
        var d = a + b + c;

        document.write("String 1 = " + a + "<br><br>");
        document.write("String 2 = " + b + "<br><br>");
        document.write("String 3 = " + c + "<br><br>");
        document.write("String 4 = " + d + "<br><br>");

        document.write("<h2>String Function</h2>");
        document.write("Concatenate = " + a.concat(b, c) + "<br><br>");
        document.write("Uppercase = " + a.toUpperCase() + "<br><br>");
        document.write("Lowercase = " + a.toLowerCase() + "<br><br>");
        document.write("Replace = " + a.replace("to", "soon") + "<br><br>");
        document.write("Length = " + a.length + "<br><br>");
        document.write("Slice = " + a.slice(0, 7) + "<br><br>");
    </script>
</body>
</html>
