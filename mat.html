
<!DOCTYPE html>
<html>
<head>
    <title>Math Function</title>
</head>
<body bgcolor="#0c827e">
<center>
    <h1>String And Math Function</h1>
</center>
<script>
    document.write("Square = " + Math.sqrt(64));
    document.write("<p>Power: " + Math.pow(2,5)+"</p>");
    document.write("Floor: " + Math.floor(6.4));
    document.write("<br><br>");
    document.write("Ceil: " + Math.ceil(5.111));
    document.write("<br><br>");
    document.write("Round: " + Math.round(5.566));
    document.write("<br><br>");
    document.write("min: " + Math.min(5,6,7));
    document.write("<br><br>");
    document.write("max: " + Math.max(5,6,7));
</script>
</body>
</html>
